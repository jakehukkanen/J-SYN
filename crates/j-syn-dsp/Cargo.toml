[package]
name = "j-syn-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "J-SYN: Zero-allocation polyphonic wavetable synthesizer DSP engine"

[dependencies]
arc-swap = "1.7"
hound = "3.5"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
assert_no_alloc = { git = "https://github.com/robbert-vdh/rust-assert-no-alloc.git", branch = "feature/nested-permit-forbid", default-features = false }
